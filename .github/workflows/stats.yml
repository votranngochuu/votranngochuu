name: Generate stats card

on:
  schedule:
    - cron: "0 1 * * *"   # every day at 01:00 UTC
  workflow_dispatch:       # run manually from the Actions tab
  push:
    branches: [main]
    paths-ignore:
      - "assets/stats.svg"

permissions:
  contents: write

concurrency:
  group: stats-card
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build assets/stats.svg
        run: python scripts/build_stats.py
        env:
          # Optional repo secret STATS_TOKEN (a read-only PAT) also counts private-repo commits.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Commit and push if the SVG changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          if git diff --cached --quiet; then
            echo "stats.svg is unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore(stats): refresh stats [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
