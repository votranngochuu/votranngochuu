<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="Work">
  <title>Work</title>
  <defs>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4285F4"/><stop offset=".6" stop-color="#4285F4" stop-opacity=".25"/><stop offset="1" stop-color="#4285F4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .up { opacity: 0; animation: up .7s cubic-bezier(.2,.7,.2,1) .1s forwards; }
    .up2 { animation-delay: .3s; }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .line { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.2s ease-out .4s forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .shine { animation: sweep 4s ease-in-out 1.6s infinite; opacity: 0; }
    @keyframes sweep { 0% { opacity: 0; transform: translateX(0); } 10% { opacity: .8; } 60% { opacity: .8; transform: translateX(802px); } 61%,100% { opacity: 0; transform: translateX(802px); } }
    .dot { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.5); opacity: .6; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .up { opacity: 1; } .line { transform: none; } }
  </style>
  <rect id="panel" width="1200" height="90" rx="16" fill="#0d1117"/>
  <text class="up mono" x="40" y="40" font-size="15" font-weight="700" fill="#4285F4" letter-spacing="2">01 //</text>
  <text class="up sans" x="102" y="42" font-size="28" font-weight="800" fill="#ffffff">Work</text>
  <text class="up up2 mono" x="40" y="70" font-size="13" fill="#8b949e">built · shipped · measured</text>
  <circle class="dot" cx="1160" cy="34" r="5" fill="#4285F4"/>
  <rect class="line" x="218" y="33" width="922" height="2" rx="1" fill="url(#ln)"/>
  <rect class="shine" x="218" y="32" width="120" height="4" fill="url(#sh)"/>

  <!--snow:start--><style>
    .s101a { animation: s101A linear infinite; }
    .s101b { animation: s101B linear infinite; }
    .s101g { animation: s101G linear infinite; }
    @keyframes s101A { from { transform: translate(0px,-20px); } to { transform: translate(28px,110px); } }
    @keyframes s101B { from { transform: translate(0px,-20px); } to { transform: translate(-28px,110px); } }
    @keyframes s101G { from { transform: translate(0px,-30px) rotate(0deg); } to { transform: translate(18px,120px) rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .s101 { display: none; } }
  </style>
  <clipPath id="s101clip"><rect width="1200" height="90" rx="16"/></clipPath>
  <g class="s101" clip-path="url(#s101clip)" fill="#ffffff" pointer-events="none">
  <circle class="s101a" cx="697.4" cy="0" r="1.11" opacity="0.83" style="animation-duration:8.8s;animation-delay:-4.1s"/>
  <circle class="s101b" cx="722.5" cy="0" r="2.27" opacity="0.54" style="animation-duration:8.1s;animation-delay:-2.7s"/>
  <circle class="s101b" cx="84.4" cy="0" r="1.11" opacity="0.30" style="animation-duration:8.0s;animation-delay:-2.9s"/>
  <circle class="s101b" cx="943.5" cy="0" r="1.18" opacity="0.72" style="animation-duration:6.2s;animation-delay:-0.4s"/>
  <circle class="s101b" cx="365.1" cy="0" r="0.98" opacity="0.74" style="animation-duration:7.5s;animation-delay:-5.0s"/>
  <circle class="s101a" cx="473.6" cy="0" r="1.41" opacity="0.50" style="animation-duration:6.1s;animation-delay:-4.1s"/>
  <circle class="s101b" cx="1046.2" cy="0" r="1.15" opacity="0.31" style="animation-duration:8.1s;animation-delay:-3.0s"/>
  <circle class="s101a" cx="11.3" cy="0" r="1.70" opacity="0.34" style="animation-duration:4.2s;animation-delay:-0.8s"/>
  <circle class="s101b" cx="916.3" cy="0" r="1.45" opacity="0.84" style="animation-duration:8.3s;animation-delay:-7.4s"/>
  <circle class="s101a" cx="199.6" cy="0" r="2.15" opacity="0.56" style="animation-duration:8.5s;animation-delay:-1.5s"/>
  <g class="s101g" style="animation-duration:9.3s;animation-delay:-5.0s;transform-box:fill-box;transform-origin:center"><text x="1126.3" y="0" font-size="10.5" opacity=".55" text-anchor="middle" font-family="'Segoe UI Symbol','DejaVu Sans',sans-serif">❄</text></g>
  </g><!--snow:end-->
</svg>
