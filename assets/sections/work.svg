<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="Selected Work">
  <title>Selected Work</title>
  <defs>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4285F4"/><stop offset=".6" stop-color="#4285F4" stop-opacity=".25"/><stop offset="1" stop-color="#4285F4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .up { opacity: 0; animation: up .7s cubic-bezier(.2,.7,.2,1) .1s forwards; }
    .up2 { animation-delay: .3s; }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .line { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.2s ease-out .4s forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .shine { animation: sweep 4s ease-in-out 1.6s infinite; opacity: 0; }
    @keyframes sweep { 0% { opacity: 0; transform: translateX(0); } 10% { opacity: .8; } 60% { opacity: .8; transform: translateX(980px); } 61%,100% { opacity: 0; transform: translateX(980px); } }
    .dot { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.5); opacity: .6; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .up { opacity: 1; } .line { transform: none; } }
  </style>
  <rect id="panel" width="1200" height="90" rx="16" fill="#0d1117"/>
  <text class="up mono" x="40" y="40" font-size="15" font-weight="700" fill="#4285F4" letter-spacing="2">01 //</text>
  <text class="up sans" x="102" y="42" font-size="28" font-weight="800" fill="#ffffff">Selected Work</text>
  <text class="up up2 mono" x="40" y="70" font-size="13" fill="#8b949e">things I built and can prove</text>
  <circle class="dot" cx="1160" cy="34" r="5" fill="#4285F4"/>
  <rect class="line" x="420" y="33" width="720" height="2" rx="1" fill="url(#ln)"/>
  <rect class="shine" x="420" y="32" width="120" height="4" fill="url(#sh)"/>

  <!--snow:start--><style>
    .s64a { animation: s64A linear infinite; }
    .s64b { animation: s64B linear infinite; }
    .s64g { animation: s64G linear infinite; }
    @keyframes s64A { from { transform: translate(0px,-20px); } to { transform: translate(28px,110px); } }
    @keyframes s64B { from { transform: translate(0px,-20px); } to { transform: translate(-28px,110px); } }
    @keyframes s64G { from { transform: translate(0px,-30px) rotate(0deg); } to { transform: translate(18px,120px) rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .s64 { display: none; } }
  </style>
  <clipPath id="s64clip"><rect width="1200" height="90" rx="0"/></clipPath>
  <g class="s64" clip-path="url(#s64clip)" fill="#ffffff" pointer-events="none">
  <circle class="s64b" cx="571.4" cy="0" r="1.81" opacity="0.49" style="animation-duration:8.8s;animation-delay:-0.1s"/>
  <circle class="s64a" cx="844.9" cy="0" r="2.09" opacity="0.73" style="animation-duration:5.1s;animation-delay:-4.1s"/>
  <circle class="s64a" cx="95.8" cy="0" r="1.47" opacity="0.37" style="animation-duration:4.1s;animation-delay:-1.7s"/>
  <circle class="s64a" cx="1113.2" cy="0" r="1.08" opacity="0.60" style="animation-duration:8.9s;animation-delay:-2.4s"/>
  <circle class="s64a" cx="106.6" cy="0" r="0.85" opacity="0.53" style="animation-duration:8.6s;animation-delay:-2.6s"/>
  <circle class="s64a" cx="659.6" cy="0" r="1.37" opacity="0.43" style="animation-duration:5.9s;animation-delay:-2.9s"/>
  <circle class="s64a" cx="60.1" cy="0" r="1.17" opacity="0.35" style="animation-duration:5.2s;animation-delay:-3.3s"/>
  <circle class="s64a" cx="807.3" cy="0" r="2.13" opacity="0.27" style="animation-duration:8.2s;animation-delay:-2.5s"/>
  <circle class="s64a" cx="1064.3" cy="0" r="1.28" opacity="0.64" style="animation-duration:7.0s;animation-delay:-1.7s"/>
  <circle class="s64b" cx="1138.5" cy="0" r="1.04" opacity="0.40" style="animation-duration:8.8s;animation-delay:-2.6s"/>
  <g class="s64g" style="animation-duration:7.2s;animation-delay:-0.3s;transform-box:fill-box;transform-origin:center"><text x="217.8" y="0" font-size="11.1" opacity=".55" text-anchor="middle" font-family="'Segoe UI Symbol','DejaVu Sans',sans-serif">❄</text></g>
  </g><!--snow:end-->
</svg>
