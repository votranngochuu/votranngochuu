<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="Stack">
  <title>Stack</title>
  <defs>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EA4335"/><stop offset=".6" stop-color="#EA4335" stop-opacity=".25"/><stop offset="1" stop-color="#EA4335" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .up { opacity: 0; animation: up .7s cubic-bezier(.2,.7,.2,1) .1s forwards; }
    .up2 { animation-delay: .3s; }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .line { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.2s ease-out .4s forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .shine { animation: sweep 4s ease-in-out 1.6s infinite; opacity: 0; }
    @keyframes sweep { 0% { opacity: 0; transform: translateX(0); } 10% { opacity: .8; } 60% { opacity: .8; transform: translateX(804px); } 61%,100% { opacity: 0; transform: translateX(804px); } }
    .dot { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.5); opacity: .6; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .up { opacity: 1; } .line { transform: none; } }
  </style>
  <rect id="panel" width="1200" height="90" rx="16" fill="#0d1117"/>
  <text class="up mono" x="40" y="40" font-size="15" font-weight="700" fill="#EA4335" letter-spacing="2">03 //</text>
  <text class="up sans" x="102" y="42" font-size="28" font-weight="800" fill="#ffffff">Stack</text>
  <text class="up up2 mono" x="40" y="70" font-size="13" fill="#8b949e">the right tool for the job</text>
  <circle class="dot" cx="1160" cy="34" r="5" fill="#EA4335"/>
  <rect class="line" x="216" y="33" width="924" height="2" rx="1" fill="url(#ln)"/>
  <rect class="shine" x="216" y="32" width="120" height="4" fill="url(#sh)"/>

  <!--snow:start--><style>
    .s103a { animation: s103A linear infinite; }
    .s103b { animation: s103B linear infinite; }
    .s103g { animation: s103G linear infinite; }
    @keyframes s103A { from { transform: translate(0px,-20px); } to { transform: translate(28px,110px); } }
    @keyframes s103B { from { transform: translate(0px,-20px); } to { transform: translate(-28px,110px); } }
    @keyframes s103G { from { transform: translate(0px,-30px) rotate(0deg); } to { transform: translate(18px,120px) rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .s103 { display: none; } }
  </style>
  <clipPath id="s103clip"><rect width="1200" height="90" rx="16"/></clipPath>
  <g class="s103" clip-path="url(#s103clip)" fill="#ffffff" pointer-events="none">
  <circle class="s103a" cx="1174.9" cy="0" r="1.53" opacity="0.68" style="animation-duration:7.8s;animation-delay:-1.7s"/>
  <circle class="s103a" cx="1094.8" cy="0" r="1.98" opacity="0.64" style="animation-duration:6.4s;animation-delay:-2.2s"/>
  <circle class="s103a" cx="586.9" cy="0" r="1.01" opacity="0.60" style="animation-duration:9.0s;animation-delay:-0.4s"/>
  <circle class="s103b" cx="829.7" cy="0" r="1.77" opacity="0.43" style="animation-duration:7.9s;animation-delay:-6.8s"/>
  <circle class="s103a" cx="271.9" cy="0" r="1.85" opacity="0.71" style="animation-duration:7.2s;animation-delay:-0.6s"/>
  <circle class="s103b" cx="696.4" cy="0" r="2.31" opacity="0.62" style="animation-duration:6.5s;animation-delay:-1.6s"/>
  <circle class="s103a" cx="1088.1" cy="0" r="2.01" opacity="0.57" style="animation-duration:8.2s;animation-delay:-3.8s"/>
  <circle class="s103b" cx="850.1" cy="0" r="1.27" opacity="0.54" style="animation-duration:4.8s;animation-delay:-2.0s"/>
  <circle class="s103a" cx="1103.4" cy="0" r="1.57" opacity="0.46" style="animation-duration:8.4s;animation-delay:-5.5s"/>
  <circle class="s103a" cx="366.9" cy="0" r="1.87" opacity="0.32" style="animation-duration:8.7s;animation-delay:-6.7s"/>
  <g class="s103g" style="animation-duration:9.2s;animation-delay:-5.5s;transform-box:fill-box;transform-origin:center"><text x="842.1" y="0" font-size="12.0" opacity=".55" text-anchor="middle" font-family="'Segoe UI Symbol','DejaVu Sans',sans-serif">❄</text></g>
  </g><!--snow:end-->
</svg>
