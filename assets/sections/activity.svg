<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="Pulse">
  <title>Pulse</title>
  <defs>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34A853"/><stop offset=".6" stop-color="#34A853" stop-opacity=".25"/><stop offset="1" stop-color="#34A853" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .up { opacity: 0; animation: up .7s cubic-bezier(.2,.7,.2,1) .1s forwards; }
    .up2 { animation-delay: .3s; }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .line { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.2s ease-out .4s forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .shine { animation: sweep 4s ease-in-out 1.6s infinite; opacity: 0; }
    @keyframes sweep { 0% { opacity: 0; transform: translateX(0); } 10% { opacity: .8; } 60% { opacity: .8; transform: translateX(805px); } 61%,100% { opacity: 0; transform: translateX(805px); } }
    .dot { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.5); opacity: .6; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .up { opacity: 1; } .line { transform: none; } }
  </style>
  <rect id="panel" width="1200" height="90" rx="16" fill="#0d1117"/>
  <text class="up mono" x="40" y="40" font-size="15" font-weight="700" fill="#34A853" letter-spacing="2">04 //</text>
  <text class="up sans" x="102" y="42" font-size="28" font-weight="800" fill="#ffffff">Pulse</text>
  <text class="up up2 mono" x="40" y="70" font-size="13" fill="#8b949e">live from GitHub</text>
  <circle class="dot" cx="1160" cy="34" r="5" fill="#34A853"/>
  <rect class="line" x="215" y="33" width="925" height="2" rx="1" fill="url(#ln)"/>
  <rect class="shine" x="215" y="32" width="120" height="4" fill="url(#sh)"/>

  <!--snow:start--><style>
    .s104a { animation: s104A linear infinite; }
    .s104b { animation: s104B linear infinite; }
    .s104g { animation: s104G linear infinite; }
    @keyframes s104A { from { transform: translate(0px,-20px); } to { transform: translate(28px,110px); } }
    @keyframes s104B { from { transform: translate(0px,-20px); } to { transform: translate(-28px,110px); } }
    @keyframes s104G { from { transform: translate(0px,-30px) rotate(0deg); } to { transform: translate(18px,120px) rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .s104 { display: none; } }
  </style>
  <clipPath id="s104clip"><rect width="1200" height="90" rx="16"/></clipPath>
  <g class="s104" clip-path="url(#s104clip)" fill="#ffffff" pointer-events="none">
  <circle class="s104a" cx="1152.0" cy="0" r="2.19" opacity="0.69" style="animation-duration:5.2s;animation-delay:-1.7s"/>
  <circle class="s104b" cx="968.1" cy="0" r="0.83" opacity="0.35" style="animation-duration:8.6s;animation-delay:-1.0s"/>
  <circle class="s104a" cx="442.5" cy="0" r="0.90" opacity="0.37" style="animation-duration:5.3s;animation-delay:-5.3s"/>
  <circle class="s104a" cx="754.0" cy="0" r="1.46" opacity="0.53" style="animation-duration:6.8s;animation-delay:-1.8s"/>
  <circle class="s104a" cx="1034.1" cy="0" r="0.86" opacity="0.27" style="animation-duration:8.1s;animation-delay:-1.0s"/>
  <circle class="s104a" cx="302.7" cy="0" r="1.46" opacity="0.80" style="animation-duration:5.8s;animation-delay:-5.8s"/>
  <circle class="s104b" cx="976.1" cy="0" r="0.95" opacity="0.68" style="animation-duration:6.4s;animation-delay:-5.0s"/>
  <circle class="s104a" cx="759.2" cy="0" r="2.26" opacity="0.85" style="animation-duration:4.9s;animation-delay:-2.6s"/>
  <circle class="s104a" cx="645.7" cy="0" r="0.85" opacity="0.53" style="animation-duration:5.1s;animation-delay:-2.3s"/>
  <circle class="s104b" cx="184.8" cy="0" r="0.82" opacity="0.74" style="animation-duration:5.3s;animation-delay:-0.4s"/>
  <g class="s104g" style="animation-duration:9.1s;animation-delay:-6.5s;transform-box:fill-box;transform-origin:center"><text x="751.4" y="0" font-size="13.8" opacity=".55" text-anchor="middle" font-family="'Segoe UI Symbol','DejaVu Sans',sans-serif">❄</text></g>
  </g><!--snow:end-->
</svg>
