<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="Activity">
  <title>Activity</title>
  <defs>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34A853"/><stop offset=".6" stop-color="#34A853" stop-opacity=".25"/><stop offset="1" stop-color="#34A853" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .up { opacity: 0; animation: up .7s cubic-bezier(.2,.7,.2,1) .1s forwards; }
    .up2 { animation-delay: .3s; }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .line { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.2s ease-out .4s forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .shine { animation: sweep 4s ease-in-out 1.6s infinite; opacity: 0; }
    @keyframes sweep { 0% { opacity: 0; transform: translateX(0); } 10% { opacity: .8; } 60% { opacity: .8; transform: translateX(980px); } 61%,100% { opacity: 0; transform: translateX(980px); } }
    .dot { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.5); opacity: .6; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .up { opacity: 1; } .line { transform: none; } }
  </style>
  <rect id="panel" width="1200" height="90" rx="16" fill="#0d1117"/>
  <text class="up mono" x="40" y="40" font-size="15" font-weight="700" fill="#34A853" letter-spacing="2">03 //</text>
  <text class="up sans" x="102" y="42" font-size="28" font-weight="800" fill="#ffffff">Activity</text>
  <text class="up up2 mono" x="40" y="70" font-size="13" fill="#8b949e">live from GitHub · refreshed daily</text>
  <circle class="dot" cx="1160" cy="34" r="5" fill="#34A853"/>
  <rect class="line" x="420" y="33" width="720" height="2" rx="1" fill="url(#ln)"/>
  <rect class="shine" x="420" y="32" width="120" height="4" fill="url(#sh)"/>

  <!--snow:start--><style>
    .s68a { animation: s68A linear infinite; }
    .s68b { animation: s68B linear infinite; }
    .s68g { animation: s68G linear infinite; }
    @keyframes s68A { from { transform: translate(0px,-20px); } to { transform: translate(28px,110px); } }
    @keyframes s68B { from { transform: translate(0px,-20px); } to { transform: translate(-28px,110px); } }
    @keyframes s68G { from { transform: translate(0px,-30px) rotate(0deg); } to { transform: translate(18px,120px) rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .s68 { display: none; } }
  </style>
  <clipPath id="s68clip"><rect width="1200" height="90" rx="0"/></clipPath>
  <g class="s68" clip-path="url(#s68clip)" fill="#ffffff" pointer-events="none">
  <circle class="s68a" cx="890.0" cy="0" r="2.31" opacity="0.70" style="animation-duration:8.7s;animation-delay:-1.0s"/>
  <circle class="s68b" cx="518.2" cy="0" r="1.22" opacity="0.77" style="animation-duration:5.7s;animation-delay:-5.6s"/>
  <circle class="s68b" cx="199.9" cy="0" r="1.84" opacity="0.72" style="animation-duration:4.7s;animation-delay:-2.5s"/>
  <circle class="s68a" cx="127.3" cy="0" r="1.35" opacity="0.31" style="animation-duration:7.1s;animation-delay:-1.4s"/>
  <circle class="s68a" cx="5.7" cy="0" r="2.13" opacity="0.51" style="animation-duration:6.0s;animation-delay:-0.8s"/>
  <circle class="s68a" cx="707.3" cy="0" r="1.80" opacity="0.61" style="animation-duration:5.8s;animation-delay:-4.5s"/>
  <circle class="s68a" cx="13.8" cy="0" r="2.31" opacity="0.48" style="animation-duration:7.2s;animation-delay:-2.0s"/>
  <circle class="s68a" cx="507.8" cy="0" r="1.41" opacity="0.32" style="animation-duration:7.8s;animation-delay:-3.3s"/>
  <circle class="s68b" cx="39.1" cy="0" r="2.39" opacity="0.48" style="animation-duration:4.8s;animation-delay:-1.2s"/>
  <circle class="s68a" cx="853.2" cy="0" r="2.09" opacity="0.72" style="animation-duration:5.4s;animation-delay:-3.2s"/>
  <g class="s68g" style="animation-duration:10.5s;animation-delay:-5.3s;transform-box:fill-box;transform-origin:center"><text x="580.1" y="0" font-size="13.3" opacity=".55" text-anchor="middle" font-family="'Segoe UI Symbol','DejaVu Sans',sans-serif">❄</text></g>
  </g><!--snow:end-->
</svg>
