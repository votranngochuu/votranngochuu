<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="Hackathons &amp; Contests Joined">
  <title>Hackathons &amp; Contests Joined</title>
  <defs>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBBC05"/><stop offset=".6" stop-color="#FBBC05" stop-opacity=".25"/><stop offset="1" stop-color="#FBBC05" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .up { opacity: 0; animation: up .7s cubic-bezier(.2,.7,.2,1) .1s forwards; }
    .up2 { animation-delay: .3s; }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .line { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.2s ease-out .4s forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .shine { animation: sweep 4s ease-in-out 1.6s infinite; opacity: 0; }
    @keyframes sweep { 0% { opacity: 0; transform: translateX(0); } 10% { opacity: .8; } 60% { opacity: .8; transform: translateX(800px); } 61%,100% { opacity: 0; transform: translateX(800px); } }
    .dot { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.5); opacity: .6; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .up { opacity: 1; } .line { transform: none; } }
  </style>
  <rect id="panel" width="1200" height="90" rx="16" fill="#0d1117"/>
  <text class="up mono" x="40" y="40" font-size="15" font-weight="700" fill="#FBBC05" letter-spacing="2">02 //</text>
  <text class="up sans" x="102" y="42" font-size="28" font-weight="800" fill="#ffffff">Hackathons &amp; Contests Joined</text>
  <text class="up up2 mono" x="40" y="70" font-size="13" fill="#8b949e">competed on national &amp; international stages</text>
  <circle class="dot" cx="1160" cy="34" r="5" fill="#FBBC05"/>
  <rect class="line" x="600" y="33" width="540" height="2" rx="1" fill="url(#ln)"/>
  <rect class="shine" x="600" y="32" width="120" height="4" fill="url(#sh)"/>

  <!--snow:start--><style>
    .s47a { animation: s47A linear infinite; }
    .s47b { animation: s47B linear infinite; }
    .s47g { animation: s47G linear infinite; }
    @keyframes s47A { from { transform: translate(0px,-20px); } to { transform: translate(28px,110px); } }
    @keyframes s47B { from { transform: translate(0px,-20px); } to { transform: translate(-28px,110px); } }
    @keyframes s47G { from { transform: translate(0px,-30px) rotate(0deg); } to { transform: translate(18px,120px) rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .s47 { display: none; } }
  </style>
  <clipPath id="s47clip"><rect width="1200" height="90" rx="0"/></clipPath>
  <g class="s47" clip-path="url(#s47clip)" fill="#ffffff" pointer-events="none">
  <circle class="s47b" cx="422.2" cy="0" r="1.49" opacity="0.52" style="animation-duration:5.8s;animation-delay:-3.0s"/>
  <circle class="s47b" cx="738.7" cy="0" r="2.07" opacity="0.65" style="animation-duration:9.0s;animation-delay:-0.0s"/>
  <circle class="s47a" cx="868.6" cy="0" r="0.81" opacity="0.74" style="animation-duration:5.6s;animation-delay:-2.4s"/>
  <circle class="s47b" cx="627.9" cy="0" r="1.37" opacity="0.82" style="animation-duration:4.2s;animation-delay:-1.6s"/>
  <circle class="s47a" cx="721.2" cy="0" r="1.69" opacity="0.71" style="animation-duration:5.2s;animation-delay:-4.4s"/>
  <circle class="s47a" cx="150.6" cy="0" r="0.96" opacity="0.60" style="animation-duration:6.6s;animation-delay:-5.4s"/>
  <circle class="s47a" cx="778.6" cy="0" r="2.21" opacity="0.81" style="animation-duration:8.4s;animation-delay:-1.8s"/>
  <circle class="s47a" cx="927.7" cy="0" r="1.77" opacity="0.65" style="animation-duration:5.5s;animation-delay:-4.2s"/>
  <circle class="s47b" cx="970.9" cy="0" r="2.28" opacity="0.46" style="animation-duration:6.9s;animation-delay:-3.4s"/>
  <circle class="s47a" cx="312.3" cy="0" r="1.97" opacity="0.73" style="animation-duration:7.1s;animation-delay:-4.5s"/>
  <g class="s47g" style="animation-duration:9.4s;animation-delay:-8.7s;transform-box:fill-box;transform-origin:center"><text x="460.6" y="0" font-size="11.8" opacity=".55" text-anchor="middle" font-family="'Segoe UI Symbol','DejaVu Sans',sans-serif">❄</text></g>
  </g><!--snow:end-->
</svg>
