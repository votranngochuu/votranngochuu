<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="Competitions">
  <title>Competitions</title>
  <defs>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBBC05"/><stop offset=".6" stop-color="#FBBC05" stop-opacity=".25"/><stop offset="1" stop-color="#FBBC05" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .up { opacity: 0; animation: up .7s cubic-bezier(.2,.7,.2,1) .1s forwards; }
    .up2 { animation-delay: .3s; }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .line { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.2s ease-out .4s forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .shine { animation: sweep 4s ease-in-out 1.6s infinite; opacity: 0; }
    @keyframes sweep { 0% { opacity: 0; transform: translateX(0); } 10% { opacity: .8; } 60% { opacity: .8; transform: translateX(694px); } 61%,100% { opacity: 0; transform: translateX(694px); } }
    .dot { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.5); opacity: .6; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .up { opacity: 1; } .line { transform: none; } }
  </style>
  <rect id="panel" width="1200" height="90" rx="16" fill="#0d1117"/>
  <text class="up mono" x="40" y="40" font-size="15" font-weight="700" fill="#FBBC05" letter-spacing="2">02 //</text>
  <text class="up sans" x="102" y="42" font-size="28" font-weight="800" fill="#ffffff">Competitions</text>
  <text class="up up2 mono" x="40" y="70" font-size="13" fill="#8b949e">tested under pressure</text>
  <circle class="dot" cx="1160" cy="34" r="5" fill="#FBBC05"/>
  <rect class="line" x="326" y="33" width="814" height="2" rx="1" fill="url(#ln)"/>
  <rect class="shine" x="326" y="32" width="120" height="4" fill="url(#sh)"/>

  <!--snow:start--><style>
    .s102a { animation: s102A linear infinite; }
    .s102b { animation: s102B linear infinite; }
    .s102g { animation: s102G linear infinite; }
    @keyframes s102A { from { transform: translate(0px,-20px); } to { transform: translate(28px,110px); } }
    @keyframes s102B { from { transform: translate(0px,-20px); } to { transform: translate(-28px,110px); } }
    @keyframes s102G { from { transform: translate(0px,-30px) rotate(0deg); } to { transform: translate(18px,120px) rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .s102 { display: none; } }
  </style>
  <clipPath id="s102clip"><rect width="1200" height="90" rx="16"/></clipPath>
  <g class="s102" clip-path="url(#s102clip)" fill="#ffffff" pointer-events="none">
  <circle class="s102b" cx="177.8" cy="0" r="1.79" opacity="0.35" style="animation-duration:7.7s;animation-delay:-4.7s"/>
  <circle class="s102a" cx="351.4" cy="0" r="1.49" opacity="0.60" style="animation-duration:7.8s;animation-delay:-4.2s"/>
  <circle class="s102a" cx="882.4" cy="0" r="1.40" opacity="0.39" style="animation-duration:4.7s;animation-delay:-3.8s"/>
  <circle class="s102a" cx="731.2" cy="0" r="1.51" opacity="0.55" style="animation-duration:5.2s;animation-delay:-2.7s"/>
  <circle class="s102b" cx="588.9" cy="0" r="1.46" opacity="0.54" style="animation-duration:4.4s;animation-delay:-2.7s"/>
  <circle class="s102a" cx="453.0" cy="0" r="1.11" opacity="0.51" style="animation-duration:7.1s;animation-delay:-6.0s"/>
  <circle class="s102b" cx="1089.1" cy="0" r="1.07" opacity="0.37" style="animation-duration:7.1s;animation-delay:-4.5s"/>
  <circle class="s102b" cx="153.2" cy="0" r="1.78" opacity="0.83" style="animation-duration:8.0s;animation-delay:-2.1s"/>
  <circle class="s102a" cx="767.1" cy="0" r="1.55" opacity="0.82" style="animation-duration:6.3s;animation-delay:-4.0s"/>
  <circle class="s102b" cx="468.9" cy="0" r="1.99" opacity="0.61" style="animation-duration:8.7s;animation-delay:-5.4s"/>
  <g class="s102g" style="animation-duration:11.2s;animation-delay:-10.5s;transform-box:fill-box;transform-origin:center"><text x="632.1" y="0" font-size="12.8" opacity=".55" text-anchor="middle" font-family="'Segoe UI Symbol','DejaVu Sans',sans-serif">❄</text></g>
  </g><!--snow:end-->
</svg>
