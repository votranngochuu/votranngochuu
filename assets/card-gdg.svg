<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="t d">
  <title id="t">Lead — Google Developer Groups on Campus, FPT University</title>
  <desc id="d">Lead of Google Developer Groups on Campus at FPT University, Ho Chi Minh City. Speaker at Road to DevFest 2026, organizer of the internal hackathon, builder of the club platform with a Gemini agent.</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#4285F4"/>
      <stop offset=".34" stop-color="#EA4335"/>
      <stop offset=".67" stop-color="#FBBC05"/>
      <stop offset="1" stop-color="#34A853"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r=".75" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#4285F4" stop-opacity=".12"/>
      <stop offset="1" stop-color="#4285F4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .title { font-size: 27px; font-weight: 700; fill: #ffffff; }
    .muted { font-size: 15px; fill: #8b949e; }
    .body { font-size: 15px; fill: #c9d1d9; }
    .tag { font-size: 12px; font-weight: 700; fill: #4285F4; letter-spacing: 2px; }
    .foot { font-size: 12px; fill: #8b949e; }
    .f {
      opacity: 1;
      animation: fadeUp .6s ease-out both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .dot {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 30%, 100% { transform: scale(1); opacity: .75; }
      15% { transform: scale(1.35); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .f, .dot { opacity: 1; transform: none; }
    }
  </style>

  <!-- card -->
  <rect x="1" y="1" width="598" height="298" rx="20" fill="#0d1117" stroke="url(#border)" stroke-width="2"/>
  <rect x="2" y="2" width="596" height="296" rx="19" fill="url(#glow)"/>

  <!-- header: tag + pulsing dots -->
  <g class="f" style="animation-delay:.2s">
    <rect x="28" y="26" width="64" height="28" rx="14" fill="#4285F4" fill-opacity=".15"/>
    <text x="61" y="44.5" text-anchor="middle" class="mono tag">LEAD</text>
    <circle class="dot" cx="112" cy="40" r="5" fill="#4285F4" style="animation-delay:0s"/>
    <circle class="dot" cx="130" cy="40" r="5" fill="#EA4335" style="animation-delay:.25s"/>
    <circle class="dot" cx="148" cy="40" r="5" fill="#FBBC05" style="animation-delay:.5s"/>
    <circle class="dot" cx="166" cy="40" r="5" fill="#34A853" style="animation-delay:.75s"/>
  </g>

  <!-- titles -->
  <text x="28" y="92" class="sans title f" style="animation-delay:.35s">Google Developer Groups</text>
  <text x="28" y="125" class="sans title f" style="animation-delay:.5s">on Campus · FPT University</text>
  <text x="28" y="153" class="sans muted f" style="animation-delay:.65s">Ho Chi Minh City · community of student builders</text>

  <!-- divider -->
  <line x1="28" y1="173" x2="572" y2="173" stroke="#ffffff" stroke-opacity=".1" stroke-width="1" class="f" style="animation-delay:.8s"/>

  <!-- rows -->
  <g class="f" style="animation-delay:.95s">
    <circle cx="33" cy="196" r="4" fill="#4285F4"/>
    <text x="48" y="201" class="sans body">Speaker — Road to DevFest 2026</text>
  </g>
  <g class="f" style="animation-delay:1.1s">
    <circle cx="33" cy="222" r="4" fill="#EA4335"/>
    <text x="48" y="227" class="sans body">Organizer — Internal Hackathon</text>
  </g>
  <g class="f" style="animation-delay:1.25s">
    <circle cx="33" cy="248" r="4" fill="#34A853"/>
    <text x="48" y="253" class="sans body">Builder — club platform with a Gemini agent</text>
  </g>

  <!-- footer -->
  <text x="572" y="272" text-anchor="end" class="mono foot f" style="animation-delay:1.4s">people &gt; code &gt; hype</text>
</svg>
