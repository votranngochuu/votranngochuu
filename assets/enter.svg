<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Opening portfolio — click to enter votranngochuu.github.io">
  <title>Click to enter the full portfolio</title>
  <defs>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4285F4"/><stop offset=".33" stop-color="#EA4335"/>
      <stop offset=".66" stop-color="#FBBC05"/><stop offset="1" stop-color="#34A853"/>
    </linearGradient>
    <linearGradient id="border" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#4285F4"/><stop offset=".33" stop-color="#EA4335"/>
      <stop offset=".66" stop-color="#FBBC05"/><stop offset="1" stop-color="#34A853"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".6">
      <stop offset="0" stop-color="#4285F4" stop-opacity=".28"/>
      <stop offset="1" stop-color="#4285F4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }

    /* Phase 1 (0 – 1.6s): loading */
    .loading { animation: out .35s ease-in 1.6s forwards; }
    .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0);
           animation: fill 1.5s cubic-bezier(.4,.1,.2,1) .1s forwards; }
    .dots tspan { animation: blink 1s infinite; }
    .dots tspan:nth-child(2) { animation-delay: .2s; } .dots tspan:nth-child(3) { animation-delay: .4s; }
    .pct { animation: out .2s 1.6s forwards; }

    /* Phase 2 (1.7s →): call to action */
    .cta { opacity: 0; animation: in .5s cubic-bezier(.2,.7,.2,1) 1.75s forwards; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-in-out 2.3s infinite; }
    .arrow { animation: nudge 1.1s ease-in-out 2.3s infinite; }
    .halo { opacity: 0; transform-box: fill-box; transform-origin: center; animation: halo 2.2s ease-out 2.3s infinite; }
    .sweep { opacity: 0; animation: sweep 3s ease-in-out 2.4s infinite; }

    @keyframes fill  { to { transform: scaleX(1); } }
    @keyframes out   { to { opacity: 0; transform: translateY(-8px); } }
    @keyframes in    { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(8px); } }
    @keyframes halo  { 0% { opacity: .55; transform: scale(1); } 100% { opacity: 0; transform: scale(1.18, 1.6); } }
    @keyframes sweep { 0% { opacity: 0; transform: translateX(0); } 15% { opacity: 1; } 55% { opacity: 1; transform: translateX(420px); } 56%, 100% { opacity: 0; transform: translateX(420px); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .loading { opacity: 0; } .cta { opacity: 1; }
    }
  </style>

  <!-- Card -->
  <rect x="2" y="2" width="1196" height="146" rx="22" fill="#0d1117"/>
  <rect x="2" y="2" width="1196" height="146" rx="22" fill="url(#glow)"/>
  <rect x="2" y="2" width="1196" height="146" rx="22" fill="none" stroke="url(#border)" stroke-width="2.5"/>

  <!-- Phase 1: loading -->
  <g class="loading">
    <text class="mono" x="60" y="62" font-size="16" fill="#8b949e">~/portfolio $ <tspan fill="#c9d1d9">open https://votranngochuu.github.io</tspan></text>
    <text class="sans dots" x="60" y="94" font-size="22" font-weight="700" fill="#ffffff">Opening portfolio<tspan>.</tspan><tspan>.</tspan><tspan>.</tspan></text>
    <rect x="60" y="112" width="1080" height="6" rx="3" fill="#21262d"/>
    <rect class="bar" x="60" y="112" width="1080" height="6" rx="3" fill="url(#g4)"/>
  </g>

  <!-- Phase 2: call to action -->
  <g class="cta">
    <text class="mono" x="60" y="66" font-size="14" fill="#34A853" letter-spacing="2">● READY</text>
    <text class="sans" x="60" y="100" font-size="26" font-weight="800" fill="#ffffff">The full experience lives on my site</text>
    <text class="mono" x="60" y="126" font-size="14" fill="#8b949e">votranngochuu.github.io · full-screen · falling snow</text>

    <!-- Button -->
    <g class="pulse">
      <rect class="halo" x="760" y="43" width="380" height="64" rx="32" fill="none" stroke="#4285F4" stroke-width="2"/>
      <rect x="760" y="43" width="380" height="64" rx="32" fill="#4285F4"/>
      <clipPath id="btnclip"><rect x="760" y="43" width="380" height="64" rx="32"/></clipPath>
      <g clip-path="url(#btnclip)"><rect class="sweep" x="700" y="43" width="90" height="64" fill="url(#shine)"/></g>
      <text class="sans" x="930" y="83" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">Click to enter</text>
      <text class="sans arrow" x="1022" y="84" font-size="26" font-weight="800" fill="#ffffff">→</text>
    </g>
  </g>

  <!--snow:start--><style>
    .s77a { animation: s77A linear infinite; }
    .s77b { animation: s77B linear infinite; }
    .s77g { animation: s77G linear infinite; }
    @keyframes s77A { from { transform: translate(0px,-20px); } to { transform: translate(28px,170px); } }
    @keyframes s77B { from { transform: translate(0px,-20px); } to { transform: translate(-28px,170px); } }
    @keyframes s77G { from { transform: translate(0px,-30px) rotate(0deg); } to { transform: translate(18px,180px) rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .s77 { display: none; } }
  </style>
  <clipPath id="s77clip"><rect width="1200" height="150" rx="22"/></clipPath>
  <g class="s77" clip-path="url(#s77clip)" fill="#ffffff" pointer-events="none">
  <circle class="s77b" cx="958.9" cy="0" r="1.32" opacity="0.39" style="animation-duration:9.9s;animation-delay:-1.1s"/>
  <circle class="s77a" cx="1143.7" cy="0" r="2.40" opacity="0.39" style="animation-duration:8.2s;animation-delay:-5.4s"/>
  <circle class="s77b" cx="1021.3" cy="0" r="0.85" opacity="0.82" style="animation-duration:5.9s;animation-delay:-4.8s"/>
  <circle class="s77a" cx="219.4" cy="0" r="1.31" opacity="0.30" style="animation-duration:9.6s;animation-delay:-5.1s"/>
  <circle class="s77a" cx="270.7" cy="0" r="0.92" opacity="0.76" style="animation-duration:9.1s;animation-delay:-8.2s"/>
  <circle class="s77a" cx="119.8" cy="0" r="2.08" opacity="0.67" style="animation-duration:6.1s;animation-delay:-2.0s"/>
  <circle class="s77a" cx="113.9" cy="0" r="1.54" opacity="0.30" style="animation-duration:9.6s;animation-delay:-5.2s"/>
  <circle class="s77a" cx="326.3" cy="0" r="1.80" opacity="0.80" style="animation-duration:10.8s;animation-delay:-3.8s"/>
  <circle class="s77a" cx="993.8" cy="0" r="2.03" opacity="0.49" style="animation-duration:8.4s;animation-delay:-5.1s"/>
  <circle class="s77a" cx="263.0" cy="0" r="1.56" opacity="0.69" style="animation-duration:9.5s;animation-delay:-3.7s"/>
  <circle class="s77b" cx="62.7" cy="0" r="1.81" opacity="0.70" style="animation-duration:9.5s;animation-delay:-4.1s"/>
  <circle class="s77a" cx="1182.8" cy="0" r="2.25" opacity="0.66" style="animation-duration:5.1s;animation-delay:-2.4s"/>
  <circle class="s77b" cx="176.9" cy="0" r="1.65" opacity="0.26" style="animation-duration:7.8s;animation-delay:-2.8s"/>
  <circle class="s77a" cx="690.7" cy="0" r="0.90" opacity="0.54" style="animation-duration:9.5s;animation-delay:-7.2s"/>
  <g class="s77g" style="animation-duration:11.7s;animation-delay:-5.4s;transform-box:fill-box;transform-origin:center"><text x="833.2" y="0" font-size="11.7" opacity=".55" text-anchor="middle" font-family="'Segoe UI Symbol','DejaVu Sans',sans-serif">❄</text></g>
  <g class="s77g" style="animation-duration:8.2s;animation-delay:-7.0s;transform-box:fill-box;transform-origin:center"><text x="1022.3" y="0" font-size="16.8" opacity=".55" text-anchor="middle" font-family="'Segoe UI Symbol','DejaVu Sans',sans-serif">❄</text></g>
  </g><!--snow:end-->
</svg>
