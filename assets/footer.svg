<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Systems scale code. Communities scale people. Võ Trần Ngọc Hữu, Ho Chi Minh City, open to back-end and AI roles">
  <title>Systems scale code. Communities scale people.</title>
  <defs>
    <clipPath id="card"><rect width="1200" height="200" rx="20"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff"/></pattern>
    <linearGradient id="g4" gradientUnits="userSpaceOnUse" x1="548" y1="0" x2="980" y2="0">
      <stop offset="0" stop-color="#4285F4"/>
      <stop offset=".36" stop-color="#EA4335"/>
      <stop offset=".68" stop-color="#FBBC05"/>
      <stop offset="1" stop-color="#34A853"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4285F4"/><stop offset=".25" stop-color="#4285F4"/>
      <stop offset=".25" stop-color="#EA4335"/><stop offset=".5" stop-color="#EA4335"/>
      <stop offset=".5" stop-color="#FBBC05"/><stop offset=".75" stop-color="#FBBC05"/>
      <stop offset=".75" stop-color="#34A853"/><stop offset="1" stop-color="#34A853"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .blob { animation: drift 18s ease-in-out infinite alternate; }
    .b2 { animation-duration: 22s; animation-delay: -7s; }
    @keyframes drift {
      0%   { transform: translate(0px, 0px); }
      50%  { transform: translate(50px, -20px); }
      100% { transform: translate(-40px, 15px); }
    }
    .up { opacity: 0; animation: up .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .5s; } .d3 { animation-delay: .8s; }
    .dot { transform-box: fill-box; transform-origin: center; opacity: .45; animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 60%, 100% { opacity: .45; transform: scale(1); } 20% { opacity: 1; transform: scale(1.6); } }
    .p2 { animation-delay: .3s; } .p3 { animation-delay: .6s; } .p4 { animation-delay: .9s; }
    .sweep { animation: sweep 3.5s ease-in-out infinite; }
    @keyframes sweep { from { transform: translateX(-260px); } to { transform: translateX(1200px); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .up { opacity: 1; transform: none; }
      .dot { opacity: 1; transform: none; }
      .sweep { opacity: 0; }
    }
  </style>

  <g clip-path="url(#card)">
    <!-- Background -->
    <rect width="1200" height="200" fill="#0d1117"/>
    <g filter="url(#blur)" opacity=".22">
      <circle class="blob"    cx="160"  cy="40"  r="130" fill="#4285F4"/>
      <circle class="blob b2" cx="1060" cy="170" r="130" fill="#34A853"/>
    </g>
    <rect width="1200" height="200" fill="url(#dots)" opacity=".05"/>

    <!-- Closing line -->
    <text class="up d1 sans" x="600" y="92" text-anchor="middle" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-.5">Systems scale code. <tspan fill="url(#g4)">Communities scale people.</tspan></text>

    <!-- Signature -->
    <text class="up d2 mono" x="600" y="130" text-anchor="middle" font-size="15" fill="#8b949e">Võ Trần Ngọc Hữu <tspan fill="#c9d1d9">·</tspan> Ho Chi Minh City <tspan fill="#c9d1d9">·</tspan> open to back-end &amp; AI roles</text>

    <!-- Pulsing dots -->
    <g class="up d3">
      <circle class="dot"    cx="570" cy="161" r="4" fill="#4285F4"/>
      <circle class="dot p2" cx="590" cy="161" r="4" fill="#EA4335"/>
      <circle class="dot p3" cx="610" cy="161" r="4" fill="#FBBC05"/>
      <circle class="dot p4" cx="630" cy="161" r="4" fill="#34A853"/>
    </g>

    <!-- Google colour bar with shine -->
    <rect x="0" y="194" width="1200" height="6" fill="url(#bar)"/>
    <rect class="sweep" x="0" y="194" width="260" height="6" fill="url(#shine)" opacity=".7"/>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="198.5" rx="19.5" fill="none" stroke="#21262d" stroke-width="1.5"/>

  <!--snow:start--><style>
    .s131a { animation: s131A linear infinite; }
    .s131b { animation: s131B linear infinite; }
    .s131g { animation: s131G linear infinite; }
    @keyframes s131A { from { transform: translate(0px,-20px); } to { transform: translate(28px,220px); } }
    @keyframes s131B { from { transform: translate(0px,-20px); } to { transform: translate(-28px,220px); } }
    @keyframes s131G { from { transform: translate(0px,-30px) rotate(0deg); } to { transform: translate(18px,230px) rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .s131 { display: none; } }
  </style>
  <clipPath id="s131clip"><rect width="1200" height="200" rx="20"/></clipPath>
  <g class="s131" clip-path="url(#s131clip)" fill="#ffffff" pointer-events="none">
  <circle class="s131a" cx="378.5" cy="0" r="2.03" opacity="0.30" style="animation-duration:7.3s;animation-delay:-2.8s"/>
  <circle class="s131b" cx="417.7" cy="0" r="1.75" opacity="0.31" style="animation-duration:6.5s;animation-delay:-4.5s"/>
  <circle class="s131b" cx="1173.1" cy="0" r="2.00" opacity="0.82" style="animation-duration:9.0s;animation-delay:-6.5s"/>
  <circle class="s131a" cx="872.0" cy="0" r="2.06" opacity="0.37" style="animation-duration:8.3s;animation-delay:-6.1s"/>
  <circle class="s131a" cx="10.5" cy="0" r="2.22" opacity="0.55" style="animation-duration:8.3s;animation-delay:-0.7s"/>
  <circle class="s131b" cx="931.6" cy="0" r="1.06" opacity="0.79" style="animation-duration:9.4s;animation-delay:-1.1s"/>
  <circle class="s131a" cx="246.5" cy="0" r="1.05" opacity="0.83" style="animation-duration:8.7s;animation-delay:-2.9s"/>
  <circle class="s131a" cx="545.5" cy="0" r="1.25" opacity="0.25" style="animation-duration:6.3s;animation-delay:-4.8s"/>
  <circle class="s131b" cx="545.2" cy="0" r="1.71" opacity="0.73" style="animation-duration:9.6s;animation-delay:-8.0s"/>
  <circle class="s131a" cx="80.7" cy="0" r="1.02" opacity="0.49" style="animation-duration:8.0s;animation-delay:-6.5s"/>
  <circle class="s131a" cx="336.7" cy="0" r="2.36" opacity="0.47" style="animation-duration:6.2s;animation-delay:-4.8s"/>
  <circle class="s131b" cx="847.7" cy="0" r="2.18" opacity="0.43" style="animation-duration:10.7s;animation-delay:-2.2s"/>
  <circle class="s131a" cx="939.8" cy="0" r="1.53" opacity="0.34" style="animation-duration:8.2s;animation-delay:-4.1s"/>
  <circle class="s131a" cx="5.7" cy="0" r="1.38" opacity="0.51" style="animation-duration:6.9s;animation-delay:-0.3s"/>
  <circle class="s131b" cx="241.5" cy="0" r="1.39" opacity="0.70" style="animation-duration:10.2s;animation-delay:-7.2s"/>
  <circle class="s131b" cx="723.5" cy="0" r="1.64" opacity="0.66" style="animation-duration:9.3s;animation-delay:-8.2s"/>
  <circle class="s131a" cx="711.1" cy="0" r="1.60" opacity="0.66" style="animation-duration:10.6s;animation-delay:-1.7s"/>
  <circle class="s131b" cx="859.6" cy="0" r="2.23" opacity="0.30" style="animation-duration:10.1s;animation-delay:-5.3s"/>
  <g class="s131g" style="animation-duration:11.9s;animation-delay:-2.2s;transform-box:fill-box;transform-origin:center"><text x="888.8" y="0" font-size="15.5" opacity=".55" text-anchor="middle" font-family="'Segoe UI Symbol','DejaVu Sans',sans-serif">❄</text></g>
  <g class="s131g" style="animation-duration:11.8s;animation-delay:-10.2s;transform-box:fill-box;transform-origin:center"><text x="1062.8" y="0" font-size="14.4" opacity=".55" text-anchor="middle" font-family="'Segoe UI Symbol','DejaVu Sans',sans-serif">❄</text></g>
  </g><!--snow:end-->
</svg>
