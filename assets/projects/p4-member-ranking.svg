<svg xmlns="http://www.w3.org/2000/svg" width="600" height="210" viewBox="0 0 600 210" role="img" aria-labelledby="t d">
  <title id="t">Member Ranking</title>
  <desc id="d">Member Ranking: Club leaderboard with a Gemini AI agent. function calling, JWT + RBAC, versioned API. React · Vite · Supabase · Gemini.</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox" gradientTransform="rotate(180 .5 .5)">
      <stop offset="0" stop-color="#4285F4"/>
      <stop offset=".34" stop-color="#EA4335"/>
      <stop offset=".67" stop-color="#FBBC05"/>
      <stop offset="1" stop-color="#34A853"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="180 .5 .5" to="540 .5 .5" dur="11s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r=".75" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#34A853" stop-opacity=".12"/>
      <stop offset="1" stop-color="#34A853" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip">
      <rect x="2" y="2" width="596" height="206" rx="19"/>
    </clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .title { font-size: 26px; font-weight: 700; fill: #ffffff; }
    .desc { font-size: 15px; fill: #c9d1d9; }
    .tag { font-size: 12px; font-weight: 700; fill: #34A853; letter-spacing: 2px; }
    .chip { font-size: 13px; fill: #34A853; }
    .tech { font-size: 13px; fill: #8b949e; }
    .go { font-size: 20px; fill: #8b949e; }
    .f {
      opacity: 1;
      animation: fadeUp .6s ease-out both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .pop {
      opacity: 1;
      transform-box: fill-box;
      transform-origin: center;
      animation: pop .5s cubic-bezier(.2, .8, .3, 1.15) both;
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(.9); }
      to { opacity: 1; transform: scale(1); }
    }
    .nudge { animation: nudge 2.4s ease-in-out infinite; }
    @keyframes nudge {
      0%, 60%, 100% { transform: translate(0, 0); }
      30% { transform: translate(3px, -3px); }
    }
    .sa { animation: snowA 10s linear infinite; }
    .sb { animation: snowB 10s linear infinite; }
    @keyframes snowA {
      0% { transform: translate(0, -10px); }
      30% { transform: translate(12px, 59px); }
      60% { transform: translate(6px, 128px); }
      100% { transform: translate(20px, 220px); }
    }
    @keyframes snowB {
      0% { transform: translate(0, -10px); }
      30% { transform: translate(-12px, 59px); }
      60% { transform: translate(-6px, 128px); }
      100% { transform: translate(-20px, 220px); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .f, .pop { opacity: 1; transform: none; }
      .snow { display: none; }
    }
  </style>

  <!-- card -->
  <rect x="1" y="1" width="598" height="208" rx="20" fill="#0d1117" stroke="url(#border)" stroke-width="2"/>
  <rect x="2" y="2" width="596" height="206" rx="19" fill="url(#glow)"/>

  <!-- snow -->
  <g class="snow" clip-path="url(#clip)" fill="#ffffff">
    <circle class="sa" cx="17.8" cy="0" r="1.6" opacity="0.72" style="animation-duration:7.4s;animation-delay:-1.7s"/>
    <circle class="sb" cx="48.7" cy="0" r="1.0" opacity="0.25" style="animation-duration:7.3s;animation-delay:-3.8s"/>
    <circle class="sa" cx="111.7" cy="0" r="1.8" opacity="0.46" style="animation-duration:9.2s;animation-delay:-6.4s"/>
    <circle class="sb" cx="135.8" cy="0" r="0.9" opacity="0.71" style="animation-duration:10.9s;animation-delay:-1.2s"/>
    <circle class="sa" cx="169.7" cy="0" r="0.9" opacity="0.78" style="animation-duration:6.9s;animation-delay:-4.3s"/>
    <circle class="sb" cx="231.3" cy="0" r="0.8" opacity="0.46" style="animation-duration:9.8s;animation-delay:-9.0s"/>
    <circle class="sa" cx="252.5" cy="0" r="1.2" opacity="0.39" style="animation-duration:6.4s;animation-delay:-4.3s"/>
    <circle class="sb" cx="307.6" cy="0" r="1.4" opacity="0.27" style="animation-duration:11.7s;animation-delay:-8.6s"/>
    <circle class="sa" cx="343.7" cy="0" r="1.3" opacity="0.71" style="animation-duration:11.0s;animation-delay:-6.5s"/>
    <circle class="sb" cx="381.0" cy="0" r="1.1" opacity="0.5" style="animation-duration:12.4s;animation-delay:-8.5s"/>
    <circle class="sa" cx="416.3" cy="0" r="1.9" opacity="0.71" style="animation-duration:6.3s;animation-delay:-1.0s"/>
    <circle class="sb" cx="453.4" cy="0" r="0.8" opacity="0.66" style="animation-duration:11.2s;animation-delay:-6.1s"/>
    <circle class="sa" cx="511.9" cy="0" r="1.3" opacity="0.36" style="animation-duration:6.9s;animation-delay:-2.3s"/>
    <circle class="sb" cx="548.1" cy="0" r="1.6" opacity="0.28" style="animation-duration:9.5s;animation-delay:-0.5s"/>
  </g>

  <!-- header: tag + link glyph -->
  <g class="f" style="animation-delay:0.15s">
    <rect x="26" y="26" width="73" height="28" rx="14" fill="#34A853" fill-opacity=".15"/>
    <text x="62.5" y="44.5" text-anchor="middle" class="mono tag">GDGoC</text>
    <g aria-label="Google Developer Groups logo">
      <rect x="490.2" y="25" width="53.8" height="30" rx="8" fill="#ffffff"/>
      <image href="data:image/png;base64," x="497.2" y="29" width="39.8" height="22" preserveAspectRatio="xMidYMid meet"/>
    </g>
    <g class="nudge"><text x="574" y="47" text-anchor="end" class="sans go">↗</text></g>
  </g>

  <!-- title + description -->
  <text x="26" y="88" class="sans title f" style="animation-delay:0.27s">Member Ranking</text>
  <text x="26" y="113" class="sans desc f" style="animation-delay:0.39s">Club leaderboard with a Gemini AI agent</text>

  <!-- proof chips -->
  <g>
    <g class="pop" style="animation-delay:0.51s">
      <rect x="26" y="128" width="152" height="28" rx="12" fill="#34A853" fill-opacity=".1" stroke="#34A853" stroke-opacity=".35" stroke-width="1"/>
      <text x="102" y="146.5" text-anchor="middle" class="mono chip">function calling</text>
    </g>
    <g class="pop" style="animation-delay:0.63s">
      <rect x="188" y="128" width="104" height="28" rx="12" fill="#34A853" fill-opacity=".1" stroke="#34A853" stroke-opacity=".35" stroke-width="1"/>
      <text x="240" y="146.5" text-anchor="middle" class="mono chip">JWT + RBAC</text>
    </g>
    <g class="pop" style="animation-delay:0.75s">
      <rect x="302" y="128" width="128" height="28" rx="12" fill="#34A853" fill-opacity=".1" stroke="#34A853" stroke-opacity=".35" stroke-width="1"/>
      <text x="366" y="146.5" text-anchor="middle" class="mono chip">versioned API</text>
    </g>
  </g>

  <!-- tech -->
  <text x="26" y="183" class="sans tech f" style="animation-delay:0.87s">React · Vite · Supabase · Gemini</text>
</svg>
