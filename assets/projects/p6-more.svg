<svg xmlns="http://www.w3.org/2000/svg" width="600" height="210" viewBox="0 0 600 210" role="img" aria-labelledby="t d">
  <title id="t">More on GitHub</title>
  <desc id="d">Explore more projects on GitHub: hackathon builds, research tools and experiments.</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox" gradientTransform="rotate(300 .5 .5)">
      <stop offset="0" stop-color="#4285F4"/>
      <stop offset=".34" stop-color="#EA4335"/>
      <stop offset=".67" stop-color="#FBBC05"/>
      <stop offset="1" stop-color="#34A853"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="300 .5 .5" to="660 .5 .5" dur="9.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r=".75" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#c9d1d9" stop-opacity=".08"/>
      <stop offset="1" stop-color="#c9d1d9" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip">
      <rect x="2" y="2" width="596" height="206" rx="19"/>
    </clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .title { font-size: 26px; font-weight: 700; fill: #ffffff; }
    .desc { font-size: 15px; fill: #c9d1d9; }
    .tag { font-size: 12px; font-weight: 700; fill: #c9d1d9; letter-spacing: 2px; }
    .chip { font-size: 13px; fill: #c9d1d9; }
    .tech { font-size: 13px; fill: #8b949e; }
    .go { font-size: 20px; fill: #8b949e; }
    .f {
      opacity: 1;
      animation: fadeUp .6s ease-out both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .pop {
      opacity: 1;
      transform-box: fill-box;
      transform-origin: center;
      animation: pop .5s cubic-bezier(.2, .8, .3, 1.15) both;
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(.9); }
      to { opacity: 1; transform: scale(1); }
    }
    .nudge { animation: nudge 2.4s ease-in-out infinite; }
    @keyframes nudge {
      0%, 60%, 100% { transform: translate(0, 0); }
      30% { transform: translate(3px, -3px); }
    }
    .sa { animation: snowA 10s linear infinite; }
    .sb { animation: snowB 10s linear infinite; }
    @keyframes snowA {
      0% { transform: translate(0, -10px); }
      30% { transform: translate(12px, 59px); }
      60% { transform: translate(6px, 128px); }
      100% { transform: translate(20px, 220px); }
    }
    @keyframes snowB {
      0% { transform: translate(0, -10px); }
      30% { transform: translate(-12px, 59px); }
      60% { transform: translate(-6px, 128px); }
      100% { transform: translate(-20px, 220px); }
    }
    .big { font-size: 32px; font-weight: 700; fill: #ffffff; }
    .sub { font-size: 15px; fill: #8b949e; }
    .dot {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 30%, 100% { transform: scale(1); opacity: .75; }
      15% { transform: scale(1.4); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .f, .pop { opacity: 1; transform: none; }
      .snow { display: none; }
    }
  </style>

  <!-- card -->
  <rect x="1" y="1" width="598" height="208" rx="20" fill="#0d1117" stroke="url(#border)" stroke-width="2"/>
  <rect x="2" y="2" width="596" height="206" rx="19" fill="url(#glow)"/>

  <!-- snow -->
  <g class="snow" clip-path="url(#clip)" fill="#ffffff">
    <circle class="sa" cx="9.7" cy="0" r="1.4" opacity="0.39" style="animation-duration:9.6s;animation-delay:-2.5s"/>
    <circle class="sb" cx="68.7" cy="0" r="1.6" opacity="0.66" style="animation-duration:13.4s;animation-delay:-6.6s"/>
    <circle class="sa" cx="99.2" cy="0" r="1.0" opacity="0.68" style="animation-duration:6.6s;animation-delay:-2.4s"/>
    <circle class="sb" cx="132.0" cy="0" r="1.8" opacity="0.5" style="animation-duration:10.0s;animation-delay:-5.3s"/>
    <circle class="sa" cx="188.2" cy="0" r="2.2" opacity="0.45" style="animation-duration:13.0s;animation-delay:-9.2s"/>
    <circle class="sb" cx="224.7" cy="0" r="2.2" opacity="0.36" style="animation-duration:8.5s;animation-delay:-4.1s"/>
    <circle class="sa" cx="255.4" cy="0" r="1.2" opacity="0.36" style="animation-duration:13.4s;animation-delay:-13.0s"/>
    <circle class="sb" cx="309.0" cy="0" r="1.9" opacity="0.47" style="animation-duration:8.5s;animation-delay:-3.4s"/>
    <circle class="sa" cx="328.4" cy="0" r="1.0" opacity="0.51" style="animation-duration:9.3s;animation-delay:-6.1s"/>
    <circle class="sb" cx="381.5" cy="0" r="0.9" opacity="0.72" style="animation-duration:9.4s;animation-delay:-4.5s"/>
    <circle class="sa" cx="416.9" cy="0" r="1.3" opacity="0.76" style="animation-duration:13.7s;animation-delay:-2.5s"/>
    <circle class="sb" cx="470.0" cy="0" r="1.9" opacity="0.7" style="animation-duration:8.3s;animation-delay:-7.5s"/>
    <circle class="sa" cx="502.0" cy="0" r="1.4" opacity="0.27" style="animation-duration:10.1s;animation-delay:-1.8s"/>
    <circle class="sb" cx="534.9" cy="0" r="2.0" opacity="0.44" style="animation-duration:12.5s;animation-delay:-4.6s"/>
  </g>

  <!-- header: tag + link glyph -->
  <g class="f" style="animation-delay:.15s">
    <rect x="26" y="26" width="90" height="28" rx="14" fill="#c9d1d9" fill-opacity=".12"/>
    <text x="71" y="44.5" text-anchor="middle" class="mono tag">EXPLORE</text>
    <g class="nudge"><text x="574" y="47" text-anchor="end" class="sans go">↗</text></g>
  </g>

  <!-- call to action -->
  <text x="300" y="112" text-anchor="middle" class="sans big f" style="animation-delay:.27s">More on GitHub →</text>
  <text x="300" y="142" text-anchor="middle" class="sans sub f" style="animation-delay:.39s">hackathon builds · research tools · experiments</text>

  <!-- dots -->
  <g class="f" style="animation-delay:.51s">
    <circle class="dot" cx="273" cy="170" r="5" fill="#4285F4" style="animation-delay:0s"/>
    <circle class="dot" cx="291" cy="170" r="5" fill="#EA4335" style="animation-delay:.25s"/>
    <circle class="dot" cx="309" cy="170" r="5" fill="#FBBC05" style="animation-delay:.5s"/>
    <circle class="dot" cx="327" cy="170" r="5" fill="#34A853" style="animation-delay:.75s"/>
  </g>
</svg>
