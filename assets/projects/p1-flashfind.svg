<svg xmlns="http://www.w3.org/2000/svg" width="600" height="210" viewBox="0 0 600 210" role="img" aria-labelledby="t d">
  <title id="t">FlashFind-Vi</title>
  <desc id="d">FlashFind-Vi: On-device Vietnamese OCR search engine. 2.5× QPS, p95 &lt; 500 ms, −30–40% RAM. Java · Inverted Index · MinHash/LSH · Bloom Filter.</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox" gradientTransform="rotate(0 .5 .5)">
      <stop offset="0" stop-color="#4285F4"/>
      <stop offset=".34" stop-color="#EA4335"/>
      <stop offset=".67" stop-color="#FBBC05"/>
      <stop offset="1" stop-color="#34A853"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r=".75" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#4285F4" stop-opacity=".12"/>
      <stop offset="1" stop-color="#4285F4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip">
      <rect x="2" y="2" width="596" height="206" rx="19"/>
    </clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .title { font-size: 26px; font-weight: 700; fill: #ffffff; }
    .desc { font-size: 15px; fill: #c9d1d9; }
    .tag { font-size: 12px; font-weight: 700; fill: #4285F4; letter-spacing: 2px; }
    .chip { font-size: 13px; fill: #4285F4; }
    .tech { font-size: 13px; fill: #8b949e; }
    .go { font-size: 20px; fill: #8b949e; }
    .f {
      opacity: 1;
      animation: fadeUp .6s ease-out both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .pop {
      opacity: 1;
      transform-box: fill-box;
      transform-origin: center;
      animation: pop .5s cubic-bezier(.2, .8, .3, 1.15) both;
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(.9); }
      to { opacity: 1; transform: scale(1); }
    }
    .nudge { animation: nudge 2.4s ease-in-out infinite; }
    @keyframes nudge {
      0%, 60%, 100% { transform: translate(0, 0); }
      30% { transform: translate(3px, -3px); }
    }
    .sa { animation: snowA 10s linear infinite; }
    .sb { animation: snowB 10s linear infinite; }
    @keyframes snowA {
      0% { transform: translate(0, -10px); }
      30% { transform: translate(12px, 59px); }
      60% { transform: translate(6px, 128px); }
      100% { transform: translate(20px, 220px); }
    }
    @keyframes snowB {
      0% { transform: translate(0, -10px); }
      30% { transform: translate(-12px, 59px); }
      60% { transform: translate(-6px, 128px); }
      100% { transform: translate(-20px, 220px); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .f, .pop { opacity: 1; transform: none; }
      .snow { display: none; }
    }
  </style>

  <!-- card -->
  <rect x="1" y="1" width="598" height="208" rx="20" fill="#0d1117" stroke="url(#border)" stroke-width="2"/>
  <rect x="2" y="2" width="596" height="206" rx="19" fill="url(#glow)"/>

  <!-- snow -->
  <g class="snow" clip-path="url(#clip)" fill="#ffffff">
    <circle class="sa" cx="18.9" cy="0" r="1.6" opacity="0.76" style="animation-duration:9.7s;animation-delay:-4.9s"/>
    <circle class="sb" cx="62.1" cy="0" r="1.1" opacity="0.53" style="animation-duration:11.0s;animation-delay:-8.7s"/>
    <circle class="sa" cx="90.3" cy="0" r="1.2" opacity="0.3" style="animation-duration:12.5s;animation-delay:-8.7s"/>
    <circle class="sb" cx="129.0" cy="0" r="2.2" opacity="0.78" style="animation-duration:11.2s;animation-delay:-6.9s"/>
    <circle class="sa" cx="171.8" cy="0" r="0.8" opacity="0.54" style="animation-duration:6.5s;animation-delay:-1.2s"/>
    <circle class="sb" cx="213.8" cy="0" r="0.8" opacity="0.51" style="animation-duration:9.5s;animation-delay:-8.0s"/>
    <circle class="sa" cx="260.5" cy="0" r="1.7" opacity="0.52" style="animation-duration:11.3s;animation-delay:-5.2s"/>
    <circle class="sb" cx="294.7" cy="0" r="2.2" opacity="0.8" style="animation-duration:12.7s;animation-delay:-9.0s"/>
    <circle class="sa" cx="335.6" cy="0" r="1.1" opacity="0.41" style="animation-duration:6.6s;animation-delay:-5.1s"/>
    <circle class="sb" cx="377.6" cy="0" r="2.0" opacity="0.46" style="animation-duration:13.7s;animation-delay:-11.6s"/>
    <circle class="sa" cx="408.0" cy="0" r="1.1" opacity="0.75" style="animation-duration:9.8s;animation-delay:-9.6s"/>
    <circle class="sb" cx="457.5" cy="0" r="0.9" opacity="0.6" style="animation-duration:12.2s;animation-delay:-3.3s"/>
    <circle class="sa" cx="490.1" cy="0" r="1.3" opacity="0.78" style="animation-duration:12.1s;animation-delay:-1.4s"/>
    <circle class="sb" cx="533.9" cy="0" r="0.9" opacity="0.28" style="animation-duration:12.4s;animation-delay:-2.2s"/>
  </g>

  <!-- header: tag + link glyph -->
  <g class="f" style="animation-delay:0.15s">
    <rect x="26" y="26" width="99" height="28" rx="14" fill="#4285F4" fill-opacity=".15"/>
    <text x="75.5" y="44.5" text-anchor="middle" class="mono tag">RESEARCH</text>
    <g aria-label="FPT University logo">
      <rect x="457.4" y="25" width="86.6" height="30" rx="8" fill="#ffffff"/>
      <image href="data:image/png;base64," x="464.4" y="29" width="72.6" height="22" preserveAspectRatio="xMidYMid meet"/>
    </g>
    <g class="nudge"><text x="574" y="47" text-anchor="end" class="sans go">↗</text></g>
  </g>

  <!-- title + description -->
  <text x="26" y="88" class="sans title f" style="animation-delay:0.27s">FlashFind-Vi</text>
  <text x="26" y="113" class="sans desc f" style="animation-delay:0.39s">On-device Vietnamese OCR search engine</text>

  <!-- proof chips -->
  <g>
    <g class="pop" style="animation-delay:0.51s">
      <rect x="26" y="128" width="88" height="28" rx="12" fill="#4285F4" fill-opacity=".1" stroke="#4285F4" stroke-opacity=".35" stroke-width="1"/>
      <text x="70" y="146.5" text-anchor="middle" class="mono chip">2.5× QPS</text>
    </g>
    <g class="pop" style="animation-delay:0.63s">
      <rect x="124" y="128" width="120" height="28" rx="12" fill="#4285F4" fill-opacity=".1" stroke="#4285F4" stroke-opacity=".35" stroke-width="1"/>
      <text x="184" y="146.5" text-anchor="middle" class="mono chip">p95 &lt; 500 ms</text>
    </g>
    <g class="pop" style="animation-delay:0.75s">
      <rect x="254" y="128" width="112" height="28" rx="12" fill="#4285F4" fill-opacity=".1" stroke="#4285F4" stroke-opacity=".35" stroke-width="1"/>
      <text x="310" y="146.5" text-anchor="middle" class="mono chip">−30–40% RAM</text>
    </g>
  </g>

  <!-- tech -->
  <text x="26" y="183" class="sans tech f" style="animation-delay:0.87s">Java · Inverted Index · MinHash/LSH · Bloom Filter</text>
</svg>
