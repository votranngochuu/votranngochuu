  <g class="s22g" style="animation-duration:12.4s;animation-delay:-5.4s;transform-box:fill-box;transform-origin:center"><text x="415.1" y="0" font-size="11.2" opacity=".55" text-anchor="middle" font-family="'Segoe UI Symbol','DejaVu Sans',sans-serif">❄</text></g>
