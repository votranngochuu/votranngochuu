  <g class="s44" clip-path="url(#s44clip)" fill="#ffffff" pointer-events="none">
  <circle class="s44a" cx="245.1" cy="0" r="1.67" opacity="0.77" style="animation-duration:7.5s;animation-delay:-1.7s"/>
  <circle class="s44b" cx="134.8" cy="0" r="1.71" opacity="0.31" style="animation-duration:12.2s;animation-delay:-8.4s"/>
  <circle class="s44a" cx="416.1" cy="0" r="1.41" opacity="0.49" style="animation-duration:11.6s;animation-delay:-3.8s"/>
  <circle class="s44b" cx="203.3" cy="0" r="1.25" opacity="0.35" style="animation-duration:10.1s;animation-delay:-6.0s"/>
  <circle class="s44b" cx="575.4" cy="0" r="0.97" opacity="0.63" style="animation-duration:13.8s;animation-delay:-0.5s"/>
  <circle class="s44a" cx="57.5" cy="0" r="1.56" opacity="0.36" style="animation-duration:7.1s;animation-delay:-5.3s"/>
  <circle class="s44b" cx="26.1" cy="0" r="2.34" opacity="0.66" style="animation-duration:11.7s;animation-delay:-8.6s"/>
  <circle class="s44b" cx="221.7" cy="0" r="1.55" opacity="0.52" style="animation-duration:12.4s;animation-delay:-1.9s"/>
  <circle class="s44a" cx="273.3" cy="0" r="2.07" opacity="0.66" style="animation-duration:8.8s;animation-delay:-7.2s"/>
