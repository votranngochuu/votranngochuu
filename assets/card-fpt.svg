<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="t d">
  <title id="t">Junior AI Engineer — FPT Software HCM</title>
  <desc id="d">Junior AI Engineer at FPT Software HCM, F-Town 3, AI-Era Program. Full-stack and RAG pipelines. 109 commits, 13.8K lines shipped, 25 working days.</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#4285F4"/>
      <stop offset=".34" stop-color="#EA4335"/>
      <stop offset=".67" stop-color="#FBBC05"/>
      <stop offset="1" stop-color="#34A853"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r=".75" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#F27024" stop-opacity=".12"/>
      <stop offset="1" stop-color="#F27024" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .title { font-size: 27px; font-weight: 700; fill: #ffffff; }
    .muted { font-size: 15px; fill: #8b949e; }
    .tag { font-size: 12px; font-weight: 700; fill: #F27024; letter-spacing: 2px; }
    .live { font-size: 12px; font-weight: 700; fill: #34A853; letter-spacing: 1.5px; }
    .num { font-size: 30px; font-weight: 700; }
    .lbl { font-size: 12px; fill: #8b949e; }
    .foot { font-size: 12px; fill: #8b949e; }
    .f {
      opacity: 1;
      animation: fadeUp .6s ease-out both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .pop {
      opacity: 1;
      transform-box: fill-box;
      transform-origin: center;
      animation: pop .6s cubic-bezier(.2, .8, .3, 1.15) both;
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(.85); }
      to { opacity: 1; transform: scale(1); }
    }
    .ring {
      opacity: .35;
      transform-box: fill-box;
      transform-origin: center;
      animation: ring 1.8s ease-out infinite;
    }
    @keyframes ring {
      0% { transform: scale(.6); opacity: .7; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .f, .pop { opacity: 1; transform: none; }
      .ring { opacity: .35; transform: none; }
    }
  </style>

  <!-- card -->
  <rect x="1" y="1" width="598" height="298" rx="20" fill="#0d1117" stroke="url(#border)" stroke-width="2"/>
  <rect x="2" y="2" width="596" height="296" rx="19" fill="url(#glow)"/>

  <!-- header: tag + live indicator -->
  <g class="f" style="animation-delay:.2s">
    <rect x="28" y="26" width="86" height="28" rx="14" fill="#F27024" fill-opacity=".15"/>
    <text x="72" y="44.5" text-anchor="middle" class="mono tag">JUNIOR</text>
    <circle class="ring" cx="134" cy="40" r="6" fill="none" stroke="#34A853" stroke-width="1.5"/>
    <circle cx="134" cy="40" r="4.5" fill="#34A853"/>
    <text x="148" y="44.5" class="mono live">ACTIVE</text>
  </g>

  <!-- titles -->
  <text x="28" y="92" class="sans title f" style="animation-delay:.35s">FPT Software HCM</text>
  <text x="28" y="125" class="sans title f" style="animation-delay:.5s">F-Town 3 · AI-Era Program</text>
  <text x="28" y="153" class="sans muted f" style="animation-delay:.65s">Junior AI Engineer · full-stack + RAG pipelines</text>

  <!-- divider -->
  <line x1="28" y1="173" x2="572" y2="173" stroke="#ffffff" stroke-opacity=".1" stroke-width="1" class="f" style="animation-delay:.8s"/>

  <!-- stats -->
  <g class="sans">
    <text x="28" y="219" class="num pop" fill="#F27024" style="animation-delay:.95s">109</text>
    <text x="28" y="240" class="lbl f" style="animation-delay:1.05s">commits</text>

    <line x1="168" y1="194" x2="168" y2="244" stroke="#ffffff" stroke-opacity=".1" class="f" style="animation-delay:1s"/>

    <text x="192" y="219" class="num pop" fill="#FBBC05" style="animation-delay:1.1s">13.8K</text>
    <text x="192" y="240" class="lbl f" style="animation-delay:1.2s">lines shipped</text>

    <line x1="332" y1="194" x2="332" y2="244" stroke="#ffffff" stroke-opacity=".1" class="f" style="animation-delay:1.15s"/>

    <text x="356" y="219" class="num pop" fill="#34A853" style="animation-delay:1.25s">25</text>
    <text x="356" y="240" class="lbl f" style="animation-delay:1.35s">working days</text>
  </g>

  <!-- footer -->
  <text x="572" y="272" text-anchor="end" class="mono foot f" style="animation-delay:1.5s">ship · measure · repeat</text>

  <!--snow:start--><style>
    .s44a { animation: s44A linear infinite; }
    .s44b { animation: s44B linear infinite; }
    .s44g { animation: s44G linear infinite; }
    @keyframes s44A { from { transform: translate(0px,-20px); } to { transform: translate(28px,320px); } }
    @keyframes s44B { from { transform: translate(0px,-20px); } to { transform: translate(-28px,320px); } }
    @keyframes s44G { from { transform: translate(0px,-30px) rotate(0deg); } to { transform: translate(18px,330px) rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .s44 { display: none; } }
  </style>
