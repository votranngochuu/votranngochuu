  <circle class="s44a" cx="596.8" cy="0" r="1.37" opacity="0.37" style="animation-duration:7.0s;animation-delay:-2.4s"/>
  <circle class="s44a" cx="364.0" cy="0" r="0.89" opacity="0.51" style="animation-duration:6.5s;animation-delay:-4.0s"/>
  <circle class="s44a" cx="85.6" cy="0" r="2.29" opacity="0.69" style="animation-duration:6.2s;animation-delay:-4.0s"/>
  <circle class="s44a" cx="163.2" cy="0" r="0.81" opacity="0.41" style="animation-duration:11.5s;animation-delay:-7.2s"/>
  <circle class="s44a" cx="514.8" cy="0" r="2.37" opacity="0.29" style="animation-duration:9.9s;animation-delay:-9.7s"/>
  <circle class="s44a" cx="597.9" cy="0" r="2.00" opacity="0.72" style="animation-duration:8.7s;animation-delay:-7.0s"/>
  <g class="s44g" style="animation-duration:12.8s;animation-delay:-7.0s;transform-box:fill-box;transform-origin:center"><text x="179.1" y="0" font-size="12.1" opacity=".55" text-anchor="middle" font-family="'Segoe UI Symbol','DejaVu Sans',sans-serif">❄</text></g>
  <g class="s44g" style="animation-duration:11.6s;animation-delay:-10.9s;transform-box:fill-box;transform-origin:center"><text x="548.0" y="0" font-size="10.5" opacity=".55" text-anchor="middle" font-family="'Segoe UI Symbol','DejaVu Sans',sans-serif">❄</text></g>
  </g><!--snow:end-->
</svg>
